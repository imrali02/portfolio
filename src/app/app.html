<main>
  <section class="container hero">
    <div class="hero__content">
      <pre class="hero__banner neon-text" aria-hidden="true">{{ banner }}</pre>

      <div class="hero__text">
        <h1>&gt;Full Stack Developer</h1>
        <p class="hero__occupation pulse-border">
          <span class="neon-cyan">&gt;</span>press any key to continue<span
            class="blink"
            >_</span
          >
        </p>
        <a href="assets/resume.pdf" class="ascii-btn" download
          >[download_resume ↓]</a
        >
      </div>
    </div>

    <span class="hero__corner hero__corner--tl" aria-hidden="true">╔═══</span>
    <span class="hero__corner hero__corner--tr" aria-hidden="true">═══╗</span>
    <span class="hero__corner hero__corner--bl" aria-hidden="true">╚═══</span>
    <span class="hero__corner hero__corner--br" aria-hidden="true">═══╝</span>
  </section>

  <section class="container" id="projects">
    <div class="container__inner container__inner--wide">
      <div class="section-heading">
        <div class="ascii-rule" aria-hidden="true">
          <span>╔</span><span class="ascii-rule__fill"></span><span>╗</span>
        </div>
        <h2 class="section-heading__label">║ PROJECTS ║</h2>
        <div class="ascii-rule" aria-hidden="true">
          <span>╚</span><span class="ascii-rule__fill"></span><span>╝</span>
        </div>
      </div>

      <div class="projects-grid">
        @for (project of projects; track project.id) {
        <app-project-card [project]="project" />
        }
      </div>
    </div>
  </section>

  <section class="container" id="contact">
    <div class="container__inner">
      <div class="section-heading">
        <div class="ascii-rule" aria-hidden="true">
          <span>╔</span><span class="ascii-rule__fill"></span><span>╗</span>
        </div>
        <h2 class="section-heading__label">║ CONTACT ME ║</h2>
        <div class="ascii-rule" aria-hidden="true">
          <span>╚</span><span class="ascii-rule__fill"></span><span>╝</span>
        </div>
      </div>

      <app-contact />
    </div>
  </section>

  <footer class="container footer">
    <pre class="footer__box">{{ footerBox }}</pre>
    <p class="footer__meta">© {{ year }} • Built with Angular</p>
  </footer>
</main>

<router-outlet />

<article class="project-card panel">
  <div class="ascii-rule" aria-hidden="true"><span>╔</span><span class="ascii-rule__fill"></span><span>╗</span></div>
  <h3 class="project-card__title">║ {{ project.title }}</h3>
  <p class="project-card__description">║ {{ project.description }}</p>
  <div class="ascii-rule" aria-hidden="true"><span>╚</span><span class="ascii-rule__fill"></span><span>╝</span></div>

  <div class="project-card__links">
    <a [href]="project.github" target="_blank" rel="noopener noreferrer" class="ascii-btn">[github →]</a>
    <a [href]="project.demo" target="_blank" rel="noopener noreferrer" class="ascii-btn">[{{ project.demoText }} →]</a>
  </div>
</article>
